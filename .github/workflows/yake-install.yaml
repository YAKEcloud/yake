---
name: Yake install

# Only manual until the repository is converted to the operator layout (docs/docs/guides/migration-to-operator.md).
# It installs the classic setup, which is replaced by the operator.
on:
  workflow_dispatch:
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        cni:
          - calico
          - cilium
        version:
          - v1.35.8
    runs-on: arc-runner-set
    timeout-minutes: 60
    name: "Yake install testrun"
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y git curl make jq
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: install
        uses: nick-fields/retry@v4
        env:
          K8S_VERSION: ${{ matrix.version }}
          CNI: ${{ matrix.cni }}
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: cd hack/ci/yake-local && ./work.sh
