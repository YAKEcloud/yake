# Inert: not listed in the root kustomization.yaml. Add it (and remove the replaced Kustomizations) only as described
# in docs/migration-to-operator.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: operator
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: configuration
  sourceRef:
    kind: GitRepository
    name: yake
  path: ./operator
  # Never prune: a wrong prune of the Garden or the operator must not delete the virtual garden.
  prune: false
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gardener-operator
      namespace: flux-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: garden
      namespace: flux-system
