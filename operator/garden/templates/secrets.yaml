{{- if .Values.garden.dnsManagedByGardener }}
apiVersion: v1
kind: Secret
metadata:
  name: yake-dns-credentials
  namespace: garden
type: Opaque
data:
  {{- toYaml (required "domains.global.credentials is required" .Values.domains.global.credentials) | nindent 2 }}
---
{{- end }}
{{- if .Values.backups.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: yake-etcd-backup
  namespace: garden
type: Opaque
data:
  {{- toYaml .Values.backups.credentials | nindent 2 }}
  {{- if eq .Values.backups.provider "S3" }}
  {{- if .Values.backups.region }}
  region: {{ .Values.backups.region | b64enc }}
  {{- end }}
  {{- if .Values.backups.endpoint }}
  endpoint: {{ .Values.backups.endpoint | b64enc }}
  {{- end }}
  {{- if .Values.backups.s3ForcePathStyle }}
  s3ForcePathStyle: {{ .Values.backups.s3ForcePathStyle | b64enc }}
  {{- end }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: gardener-dashboard-oidc
  namespace: garden
type: Opaque
stringData:
  client_id: dashboard
  client_secret: {{ required "dashboard.clientSecret is required" .Values.dashboard.clientSecret | quote }}
{{- if (.Values.issuer).ca }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gardener-dashboard-oidc-ca
  namespace: garden
type: Opaque
stringData:
  ca.crt: |
    {{- .Values.issuer.ca | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gardener-auth-config
  namespace: garden
data:
  config.yaml: |
    apiVersion: apiserver.config.k8s.io/v1beta1
    kind: AuthenticationConfiguration
    jwt:
    - issuer:
        url: https://{{ include "garden.identityDomain" . }}/oidc
        {{- if (.Values.issuer).ca }}
        certificateAuthority: |-
          {{- .Values.issuer.ca | nindent 10 }}
        {{- end }}
        audiences:
          - dashboard
          - kube-kubectl
        audienceMatchPolicy: MatchAny
      claimMappings:
        groups:
          claim: groups
          prefix: ""
        username:
          claim: email
          prefix: ""
