apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: identity-istio
  namespace: flux-system
spec:
  interval: 1m
  releaseName: identity-istio
  targetNamespace: garden
  # The namespace virtual-garden-istio-ingress is created by gardener-operator while it reconciles the Garden. Until
  # then the install fails and is retried (no upper limit).
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  dependsOn:
    - name: garden
  chart:
    spec:
      chart: operator/identity-istio
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: yake
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: Secret
      name: yake-config-0
      optional: true
    - kind: Secret
      name: yake-config-1
      optional: true
    - kind: Secret
      name: yake-config-2
      optional: true
    - kind: Secret
      name: yake-config
      optional: true
