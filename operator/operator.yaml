apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gardener-operator
  namespace: flux-system
spec:
  interval: 1m
  releaseName: gardener-operator
  targetNamespace: garden
  install:
    createNamespace: true
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
  chart:
    spec:
      chart: operator
      # Must equal the Garden version. Upgrade one minor at a time (the operator crashes when skipping a minor).
      version: v1.137.7
      sourceRef:
        kind: HelmRepository
        name: gardener-oci
        namespace: flux-system
      interval: 10m
  values:
    replicaCount: 2
